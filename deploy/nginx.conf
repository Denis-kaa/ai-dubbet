# GapirAI.uz — nginx reverse proxy (deploy artifact, mirrors /etc/nginx/sites-enabled/ai-dubber)
# Фронтенд (Next.js standalone) :3000, API :8000, файлы :8000/outputs

upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80 default_server;
    # Явные домены важны: если у nginx есть другой server block для
    # gapirai.uz, запросы по домену не должны попадать в Next.js мимо API.
    server_name gapirai.uz www.gapirai.uz 185.233.184.192 _;

    client_max_body_size 50m;

    # Health-эндпоинт (JSON, не HTML)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # Auth-роуты (фронтенд зовёт /auth/* без префикса /api)
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Admin API (admin.ts зовёт /admin/* без префикса /api)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # API на :8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Готовые видео/файлы
    location /outputs/ {
        alias /opt/ai-dubber/outputs/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Всё остальное — фронтенд (Next.js standalone на :3000)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}