services:
  # ──────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dubber_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dubber_db
      POSTGRES_USER: dubber
      POSTGRES_PASSWORD: dubber123
    ports:
      - "${COMPOSE_HOST_IP:-172.31.27.238}:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dubber -d dubber_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────
  # Redis (Celery broker + cache)
  # ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dubber_redis
    restart: unless-stopped
    command: redis-server --requirepass 0061f8931184fe1276650305600d5409df1a3af2692094d5
    ports:
      - "${COMPOSE_HOST_IP:-172.31.27.238}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "0061f8931184fe1276650305600d5409df1a3af2692094d5", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ──────────────────────────────
  # yt-dlp PO Token Provider (bgutil) — without this, YouTube serves
  # "UNPLAYABLE" for most videos from datacenter IPs even with valid
  # cookies (confirmed 2026-08-12). Only reachable inside the compose
  # network, no host port needed.
  # ──────────────────────────────
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: dubber_pot_provider
    restart: unless-stopped

  # ──────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubber_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dubber:dubber123@postgres:5432/dubber_db
      - REDIS_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_BROKER_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./cookies.txt:/app/cookies.txt:ro
      - oauth_cache:/root/.cache/yt-dlp
      - ${HOME}/.secrets/gapirai:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_started
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4

  # ──────────────────────────────
  # Celery Worker — Video Processing (download, transcription, translation)
  # ──────────────────────────────
  worker-video:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubber_worker_video
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://dubber:dubber123@postgres:5432/dubber_db
      - REDIS_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_BROKER_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - WORKER_TYPE=video
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./cookies.txt:/app/cookies.txt:ro
      - oauth_cache:/root/.cache/yt-dlp
      - ${HOME}/.secrets/gapirai:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_started
    command: celery -A backend.workers.celery_app worker -l info -Q video_processing_priority,video_processing -c 2 --hostname=video@%%h

  # ──────────────────────────────
  # Celery Worker — TTS Processing (speech synthesis)
  # ──────────────────────────────
  worker-tts:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubber_worker_tts
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://dubber:dubber123@postgres:5432/dubber_db
      - REDIS_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_BROKER_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - WORKER_TYPE=tts
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ${HOME}/.secrets/gapirai:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.workers.celery_app worker -l info -Q tts_processing -c 4 --hostname=tts@%%h

  # ──────────────────────────────
  # Celery Worker — Media Processing (FFmpeg merge, HLS)
  # ──────────────────────────────
  worker-media:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubber_worker_media
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://dubber:dubber123@postgres:5432/dubber_db
      - REDIS_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_BROKER_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - WORKER_TYPE=media
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ${HOME}/.secrets/gapirai:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.workers.celery_app worker -l info -Q media_processing -c 4 --hostname=media@%%h

  # ──────────────────────────────
  # Telegram bot -- to'liq dublyaj xizmati Telegram ichida (backend/telegram_bot.py).
  # Job yaratish mantig'i backend/services/job_creation.py orqali web API
  # bilan bir xil (Safety Gate, kvota, davomiylik chegarasi hammasi ishlaydi).
  # ──────────────────────────────
  telegram_bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubber_telegram_bot
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://dubber:dubber123@postgres:5432/dubber_db
      - REDIS_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_BROKER_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./cookies.txt:/app/cookies.txt:ro
      - oauth_cache:/root/.cache/yt-dlp
      - ${HOME}/.secrets/gapirai:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_started
    command: python3 -m backend.telegram_bot

  # ──────────────────────────────
  # Celery Flower (monitoring)
  # ──────────────────────────────
  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dubber_flower
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5555}:5555"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:0061f8931184fe1276650305600d5409df1a3af2692094d5@redis:6379/0
    depends_on:
      - redis
    command: celery -A backend.workers.celery_app flower --port=5555

volumes:
  postgres_data:
  oauth_cache:
